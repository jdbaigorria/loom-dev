[project]
name = "loom-declarative"
version = "1.0.0rc1"
description = "Declarative AI agent framework built on Strands Agents"
readme = "README.md"
requires-python = ">=3.11"
# Runtime core: what loading an agent from YAML and running it through Strands
# actually needs. Authoring/CLI/evals/AWS pieces are optional extras below, so a
# production deployment can `pip install loom-declarative` and stay slim.
dependencies = [
    "omegaconf>=2.3.0",
    # Compatible range, not an exact pin: let Strands patch/minor releases in,
    # and rely on the nightly compat CI to catch a breaking minor early.
    "strands-agents>=1.62.0,<2.0",
]

[project.optional-dependencies]
# Authoring/dev CLI: `loom init|new|run|dev|...`, wizards and template rendering.
cli = [
    "typer>=0.24.1",
    "inquirerpy>=0.3.4",
    "jinja2>=3.1.6",
    "rich>=14.3.3",
]
# Evaluation tooling (`loom evals`) ships in the loom-declarative-evals package.
# This extra is a compatibility alias.
evals = [
    "loom-declarative-evals>=1.0.0rc1,<2",
]
# AWS credential/Bedrock checks used by `loom doctor --aws`. Declared explicitly
# even though strands-agents brings boto3 transitively, so it is not silently
# dropped if strands changes its extras.
aws = [
    "boto3>=1.26.0",
]
# Built-in tools that reach the network. `builtin.apicall` needs `requests`;
# `builtin.kb` needs `boto3` (the `aws` extra above).
tools = [
    "requests>=2.28.0",
]
# Everything — the full authoring experience (equivalent to the old monolith).
all = [
    "loom-declarative[cli,evals,aws,tools]",
]


[project.urls]
Homepage = "https://github.com/jdbaigorria/loom-dev"
Repository = "https://github.com/jdbaigorria/loom-dev"
Issues = "https://github.com/jdbaigorria/loom-dev/issues"
Changelog = "https://github.com/jdbaigorria/loom-dev/blob/dev/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "poethepoet>=0.42.1",
    "pytest>=8.2.2",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.15.2",
]
docs = [
    "mkdocs>=1.6.0,<2.0",
    "mkdocs-material>=9.5.0",
    "pymdown-extensions>=10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "examples", "packages/loom-evals/tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = ["src/loom", "packages/loom-evals/src/loom_evals"]
omit = ["tests/*", "examples/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 75

[tool.mypy]
python_version = "3.11"
mypy_path = "src:packages/loom-evals/src"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "TID"]
# TID252 (relative imports) is intentionally not enforced — the codebase uses
# relative imports within subpackages by convention. TID251 (banned-api) is the
# rule that guards the Strands anti-corruption layer.
ignore = ["E501", "TID252"]

[tool.ruff.lint.isort]
known-first-party = ["loom", "loom_evals"]

# Anti-corruption layer: Strands may only be imported from loom.adapters.strands.
# This keeps every vendor import path in one place so an upstream breaking
# release is a one-file fix instead of a codebase-wide hunt.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"strands".msg = "Import Strands only via loom.adapters.strands (the anti-corruption layer)."
"strands_evals".msg = "Import strands_evals only via loom_evals.adapters.strands_evals (the anti-corruption layer)."
"mcp".msg = "Import mcp only via loom.adapters.strands."

[tool.ruff.lint.per-file-ignores]
# The ACL is the one place allowed to touch the vendor SDKs directly.
"src/loom/adapters/strands/*" = ["TID251"]
"packages/loom-evals/src/loom_evals/adapters/*" = ["TID251"]
# Examples are end-user code: authoring tools/hooks with `from strands import tool`
# is the normal Strands authoring API, not internal Loom coupling.
"examples/*" = ["TID251"]

[tool.poe.tasks]
format = "ruff format src tests examples packages"
lint   = "ruff check src tests examples packages --fix"
type   = "mypy src/loom packages/loom-evals/src/loom_evals"
test   = "pytest"
docs   = "mkdocs serve"
docs-build = "mkdocs build"

[tool.poe.tasks.check]
sequence = ["format", "lint", "type", "test"]
help     = "Format, lint, and type-check the codebase"

[project.scripts]
loom = "loom._entry:main"

[tool.setuptools.packages.find]
where = ["src"]

# Scaffolding templates (.j2/.toml/.md/.gitkeep and templated dir names) are data
# files, not importable modules. Without this they are dropped from the wheel and
# `loom init` / `loom new` silently produce empty projects when installed.
[tool.setuptools.package-data]
loom = ["templates/**/*", "templates/**/.gitkeep"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
loom-declarative-evals = { workspace = true }
