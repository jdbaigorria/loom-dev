name: Feature Request
description: Suggest an improvement or new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please describe what you want and why it matters.

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What limitation, friction, or missing capability is driving this request?
      placeholder: "I frequently need to... but currently I have to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you would like to happen — CLI flags, YAML fields, API changes, etc.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why they fall short.

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Mockups, example YAML, links to related issues or discussions.
