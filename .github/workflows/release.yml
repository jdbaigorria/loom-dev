name: Release

# Distribution is via GitHub: users install with
#   uv tool install "loom-declarative[cli] @ git+https://github.com/jdbaigorria/loom-dev@vX.Y.Z"
#   pip install "loom-declarative[cli] @ git+https://github.com/jdbaigorria/loom-dev@vX.Y.Z"
# This workflow builds the artifacts, smoke-tests the wheel, and attaches them to
# a GitHub Release. It does NOT publish to PyPI — re-add a publish step (and the
# id-token permission) if a PyPI name is registered later.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check tag matches package versions
        # The wheel filename and metadata come from pyproject, not from the tag: a
        # stale version ships every tag as the same release (v1.0.0rc6 shipped 1.0.0rc1).
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for f in pyproject.toml packages/loom-evals/pyproject.toml; do
            v=$(sed -n 's/^version = "\(.*\)"$/\1/p' "$f")
            [ "$v" = "$tag" ] || { echo "::error::$f has version $v, tag is $GITHUB_REF_NAME"; exit 1; }
          done

      - name: Build package
        run: uv build --all-packages

      - name: Smoke-test the wheel
        # Refuses to release a wheel whose `loom init` produces an empty project.
        run: |
          uv venv /tmp/loom-smoke
          uv pip install --python /tmp/loom-smoke/bin/python "$(ls dist/loom_declarative-*.whl)[cli]"
          work=$(mktemp -d)
          cd "$work"
          /tmp/loom-smoke/bin/loom init -f
          test -f loom.toml && test -f warp/config/app.yml \
            || { echo "::error::release wheel is broken: loom init scaffolds nothing"; exit 1; }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Not dist/*: uv writes a dist/.gitignore, which GitHub would attach as default.gitignore.
          files: |
            dist/*.whl
            dist/*.tar.gz
