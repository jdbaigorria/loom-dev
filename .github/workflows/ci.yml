name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Run ruff (lint)
        run: uv run ruff check src/ tests/

      - name: Run ruff (format)
        run: uv run ruff format --check src/ tests/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --all-extras

      - name: Run tests with coverage
        run: uv run pytest --cov=loom --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v5
        if: matrix.python-version == '3.14'
        with:
          files: coverage.xml
          fail_ci_if_error: false

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --group dev --all-extras

      - name: Run mypy
        run: uv run mypy src/loom

  package:
    name: Package smoke test
    runs-on: ubuntu-latest
    # Guards against the wheel dropping bundled scaffolding templates: the test
    # suite runs against the source tree, so a broken package (empty `loom init`)
    # would otherwise pass CI and only surface after install from PyPI / git+https.
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build wheel
        run: uv build --wheel

      - name: Install wheel into a clean venv
        # The CLI lives behind the [cli] extra, so `loom init` below needs it.
        run: |
          uv venv /tmp/loom-smoke
          uv pip install --python /tmp/loom-smoke/bin/python "$(echo dist/*.whl)[cli]"

      - name: Templates are bundled in the wheel
        run: |
          n=$(unzip -l dist/*.whl | grep -cE 'loom/templates/.*\.(j2|toml|md)$')
          echo "bundled template files: $n"
          test "$n" -gt 0 || { echo "::error::no scaffolding templates in wheel"; exit 1; }

      - name: loom init scaffolds a real project
        run: |
          work=$(mktemp -d)
          cd "$work"
          /tmp/loom-smoke/bin/loom init -f
          test -f loom.toml || { echo "::error::loom init produced no loom.toml"; exit 1; }
          test -f warp/config/app.yml || { echo "::error::loom init produced no app.yml"; exit 1; }
          echo "loom init scaffolded:"
          find . -type f | sort
