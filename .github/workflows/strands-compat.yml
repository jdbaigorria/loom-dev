name: Strands Compatibility

# Early-warning canary for the Strands anti-corruption layer (loom.adapters.strands).
# Runs the suite against both edges of the supported Strands range so an upstream
# break is caught here — and filed as an issue — before it reaches a user.
#
#   - latest: newest strands-agents on PyPI (ignores the pyproject ceiling), to
#     catch the next breaking release early.
#   - lowest: the minimum declared versions, to catch using an API newer than the
#     supported floor promises.
#
# A failure opens (or reuses) a `strands-compat` issue. Fix the ACL in
# src/loom/adapters/strands/, then bump the range in pyproject.toml.

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  compat:
    name: Suite vs ${{ matrix.mode }} Strands
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [latest, lowest]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Resolve Strands (${{ matrix.mode }})
        run: |
          if [ "${{ matrix.mode }}" = "lowest" ]; then
            # Lowest direct-dependency versions allowed by pyproject.
            uv sync --group dev --resolution lowest-direct
          else
            # Pinned env, then force the newest Strands from PyPI (canary).
            uv sync --group dev
            uv pip install --upgrade strands-agents strands-agents-evals
          fi

      - name: Record resolved versions
        id: versions
        run: |
          strands=$(uv run --no-sync python -c "import importlib.metadata as m; print(m.version('strands-agents'))")
          evals=$(uv run --no-sync python -c "import importlib.metadata as m; print(m.version('strands-agents-evals'))")
          echo "strands=$strands" >> "$GITHUB_OUTPUT"
          echo "evals=$evals" >> "$GITHUB_OUTPUT"
          {
            echo "### Strands compat — ${{ matrix.mode }}"
            echo "- strands-agents: \`$strands\`"
            echo "- strands-agents-evals: \`$evals\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run suite (no re-sync)
        run: uv run --no-sync pytest -q

      - name: Open compatibility issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ matrix.mode }}
          STRANDS: ${{ steps.versions.outputs.strands }}
          EVALS: ${{ steps.versions.outputs.evals }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Ensure the label exists (idempotent).
          gh label create strands-compat \
            --color FBCA04 \
            --description "Strands upstream compatibility break" 2>/dev/null || true

          # De-duplicate: one open issue per mode.
          existing=$(gh issue list --label strands-compat --state open \
            --search "in:title [$MODE]" --json number --jq 'length')
          if [ "${existing:-0}" -gt 0 ]; then
            echo "An open strands-compat issue for [$MODE] already exists; skipping."
            exit 0
          fi

          gh issue create \
            --label strands-compat \
            --title "Strands compatibility break [$MODE]: strands-agents $STRANDS" \
            --body "$(cat <<EOF
          The nightly compatibility suite failed against the **$MODE** Strands.

          - strands-agents: \`$STRANDS\`
          - strands-agents-evals: \`$EVALS\`
          - Failing run: $RUN_URL

          **Fix:** update the anti-corruption layer in \`src/loom/adapters/strands/\`
          (add the new import path to the relevant \`resolve(...)\` call), then adjust
          the supported range in \`pyproject.toml\` if needed. The failing assertion in
          \`tests/unit/test_strands_contract.py\` or \`test_adapters_strands.py\` points
          at what moved.
          EOF
          )"
